name: Studio repository housekeeping
on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the tested cleanup directly to studio_dev (never deploys)
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: studio-repository-housekeeping
  cancel-in-progress: false
jobs:
  housekeeping:
    if: github.repository == 'MaktabForlife/AcademyStudio' && github.ref == 'refs/heads/studio_dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      APPLY_HOUSEKEEPING: ${{ inputs.apply }}
      M4L_PROJECT_ROOT: ${{ github.workspace }}
      M4L_RELEASE_OUTPUT: ${{ github.workspace }}/.cloud-output
      ACADEMY_SOURCE: ${{ github.workspace }}/work/Academy
      GITLEAKS_BIN: ${{ runner.temp }}/scanner/gitleaks
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: MaktabForlife/AcademyStudio
          ref: studio_dev
          path: work/AcademyStudio
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: MaktabForlife/Academy
          ref: studio_dev
          path: work/Academy
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.18.0"
      - name: Install pinned tools on the GitHub runner
        run: |
          npm ci --prefix work/Academy/backend --no-audit --no-fund
          npm ci --prefix work/AcademyStudio --no-audit --no-fund
      - name: Install checksum-verified credential scanner
        env:
          SCANNER_DIGEST: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          mkdir -p "$RUNNER_TEMP/scanner"
          curl --fail --location --silent --show-error https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/scanner/package.tgz"
          printf '%s  %s\n' "$SCANNER_DIGEST" "$RUNNER_TEMP/scanner/package.tgz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/scanner/package.tgz" -C "$RUNNER_TEMP/scanner" gitleaks
      - name: Reconcile source, prove equivalence and test the paired app
        working-directory: work/AcademyStudio
        run: node tools/maintenance/repository-housekeeping.mjs
      - name: Save the review evidence in GitHub
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: studio-housekeeping-${{ github.run_id }}
          retention-days: 90
          path: |
            ${{ runner.temp }}/housekeeping/*.json
            ${{ runner.temp }}/housekeeping/*.log
            ${{ github.workspace }}/.cloud-output/checks.json
            ${{ github.workspace }}/.cloud-output/local-acceptance.json
            ${{ github.workspace }}/.cloud-output/static-route-matrix.json
            ${{ github.workspace }}/.cloud-output/bundle-checks.json

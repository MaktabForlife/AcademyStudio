name: Retain V109.25 verified release evidence
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.18.0"
      - name: Extract bounded allowlisted completed release records
        run: node tools/archive-v10925-evidence.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-v10925-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/v10925-retained-evidence/verified-release-evidence.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

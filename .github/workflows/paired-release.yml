name: Paired Academy and Studio release
on:
  push:
    branches: [studio_dev, feature/github-cloud-releases]
  pull_request:
    branches: [studio_dev]
  workflow_dispatch:
    inputs:
      source_ref:
        description: Academy GitHub commit or branch to test
        default: studio_dev
        type: string
      studio_ref:
        description: Studio GitHub commit or branch to test
        default: studio_dev
        type: string
      deploy:
        description: Deploy the tested pair (explicit release approval)
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: academy-studio-paired-release
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      source_sha: ${{ steps.check.outputs.source_sha }}
      studio_sha: ${{ steps.check.outputs.studio_sha }}
      version: ${{ steps.check.outputs.version }}
    env:
      M4L_PROJECT_ROOT: ${{ github.workspace }}
      M4L_RELEASE_OUTPUT: ${{ runner.temp }}/paired-release
      GITLEAKS_BIN: ${{ runner.temp }}/gitleaks/gitleaks
      WRANGLER_SEND_METRICS: "false"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: MaktabForlife/Academy
          ref: ${{ inputs.source_ref || 'studio_dev' }}
          path: work/Academy
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.studio_ref || github.sha }}
          path: work/AcademyStudio
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.18.0"
      - name: Install pinned test dependencies on GitHub
        run: |
          npm ci --prefix work/Academy/backend --no-audit --no-fund
          npm ci --prefix work/AcademyStudio --no-audit --no-fund
      - name: Install checksum-pinned credential scanner on GitHub
        env:
          SCANNER_DIGEST: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl --fail --location --silent --show-error https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks/package.tgz"
          printf '%s  %s\n' "$SCANNER_DIGEST" "$RUNNER_TEMP/gitleaks/package.tgz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks/package.tgz" -C "$RUNNER_TEMP/gitleaks" gitleaks
      - name: Test the exact paired GitHub source with synthetic data
        id: check
        working-directory: work/AcademyStudio
        env:
          NODE_OPTIONS: --import=${{ github.workspace }}/work/AcademyStudio/tools/preserve-local-files.mjs
        run: node tools/cloud-release-check.mjs check
      - name: Store review evidence in GitHub
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: paired-review-${{ github.run_id }}
          retention-days: 30
          path: |
            ${{ runner.temp }}/paired-release/checks.json
            ${{ runner.temp }}/paired-release/baseline.json
            ${{ runner.temp }}/paired-release/local-acceptance.json
            ${{ runner.temp }}/paired-release/approval-and-scope.json
            ${{ runner.temp }}/paired-release/github-verification.json
            ${{ runner.temp }}/paired-release/source-assets.json
            ${{ runner.temp }}/paired-release/studio-assets.json
            ${{ runner.temp }}/paired-release/static-route-matrix.json
            ${{ runner.temp }}/paired-release/bundle-checks.json
            ${{ runner.temp }}/paired-release/academy-tests.log
            ${{ runner.temp }}/paired-release/paired-media-tests.log
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/studio_dev'
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    permissions:
      contents: write
    env:
      M4L_PROJECT_ROOT: ${{ github.workspace }}
      M4L_RELEASE_OUTPUT: ${{ runner.temp }}/paired-release
      WRANGLER_SEND_METRICS: "false"
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.check.outputs.version }}
      CLOUDFLARE_SOURCE_API_TOKEN: ${{ secrets.CLOUDFLARE_SOURCE_API_TOKEN }}
      CLOUDFLARE_STUDIO_API_TOKEN: ${{ secrets.CLOUDFLARE_STUDIO_API_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: MaktabForlife/Academy
          ref: ${{ needs.check.outputs.source_sha }}
          path: work/Academy
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.check.outputs.studio_sha }}
          path: work/AcademyStudio
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.18.0"
      - name: Install pinned release tools on GitHub
        run: |
          npm ci --prefix work/Academy/backend --no-audit --no-fund
          npm ci --prefix work/AcademyStudio --no-audit --no-fund
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: paired-review-${{ github.run_id }}
          path: ${{ runner.temp }}/paired-release
      - name: Verify reviewed commits and activate both systems
        working-directory: work/AcademyStudio
        env:
          NODE_OPTIONS: --import=${{ github.workspace }}/work/AcademyStudio/tools/preserve-local-files.mjs
        run: |
          node tools/cloud-release-check.mjs verify-deploy
          node tools/paired-release.mjs "$RELEASE_VERSION" plan
          node tools/paired-release.mjs "$RELEASE_VERSION" capture
          node tools/paired-release.mjs "$RELEASE_VERSION" stage
          node tools/paired-release.mjs "$RELEASE_VERSION" verify-stage
          node tools/paired-release.mjs "$RELEASE_VERSION" activate
          node tools/paired-release.mjs "$RELEASE_VERSION" verify-live
          node tools/cloud-release-check.mjs publish-receipt
      - name: Store bounded deployment verification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: paired-deployment-${{ github.run_id }}
          retention-days: 30
          path: |
            ${{ runner.temp }}/paired-release/verification.json
            ${{ runner.temp }}/paired-release/public-checks.json
            ${{ runner.temp }}/paired-release/activation.json
            ${{ runner.temp }}/paired-release/staged-verification.json

name: Manual video input foundation
on:
  push:
    branches: [feature/video-autolink-foundation-20261106]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'
      - name: Offline transcript and original-time retention boundaries
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/video-foundation-evidence"
          node --check src/video-autolink/transcript.mjs
          node --check src/video-autolink/retention.mjs
          node --test --test-reporter=tap tests/video-autolink-foundation.test.mjs 2>&1 | tee "$RUNNER_TEMP/video-foundation-evidence/tests.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: video-input-foundation-${{ github.run_id }}
          path: ${{ runner.temp }}/video-foundation-evidence/
          if-no-files-found: error
          retention-days: 14

name: Manual video input foundation
on:
  push:
    branches: [feature/video-autolink-foundation-20261106]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'
      - name: Offline transcript and original-time retention boundaries
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/video-foundation-evidence"
          node --check src/video-autolink/transcript.mjs
          node --check src/video-autolink/retention.mjs
          node --check src/video-autolink/provider.mjs
          node --check src/video-autolink/candidate.mjs
          node --test --test-reporter=tap tests/video-autolink-foundation.test.mjs tests/video-autolink-provider.test.mjs 2>&1 | tee "$RUNNER_TEMP/video-foundation-evidence/tests.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: video-input-foundation-${{ github.run_id }}
          path: ${{ runner.temp }}/video-foundation-evidence/
          if-no-files-found: error
          retention-days: 14

  native-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'
      - run: npm ci --ignore-scripts
      - name: Actual native source and owning CAS boundaries
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/video-native-source-evidence"
          node --check src/video-autolink/native-source.mjs
          node --check src/video-autolink/jobs.mjs
          node --check src/video-autolink/review.mjs
          node --check src/video-autolink/cleanup.mjs
          node --check src/video-autolink/workflow.mjs
          node --check src/video-autolink/commands.mjs
          node --test --test-reporter=tap tests/video-autolink-native-source.test.mjs tests/video-autolink-jobs.test.mjs tests/video-autolink-review.test.mjs tests/video-autolink-commands.test.mjs 2>&1 | tee "$RUNNER_TEMP/video-native-source-evidence/tests.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: video-native-source-${{ github.run_id }}
          path: ${{ runner.temp }}/video-native-source-evidence/
          if-no-files-found: error
          retention-days: 14

  native-attachment:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'
      - run: npm ci --ignore-scripts
      - name: Native attachment without placeholder generation; retained manual baseline
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/video-attachment-evidence"
          node --test --test-reporter=tap tests/video-autolink-source-attachment.test.mjs tests/media-workflow.test.mjs tests/media-attribution.test.mjs 2>&1 | tee "$RUNNER_TEMP/video-attachment-evidence/tests.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: video-native-attachment-${{ github.run_id }}
          path: ${{ runner.temp }}/video-attachment-evidence/
          if-no-files-found: error
          retention-days: 14

  transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'
      - run: npm ci --ignore-scripts
      - name: Actual default-off native and signed processing entries
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/video-transport-evidence"
          node --check src/video-autolink/http.mjs
          node --check src/video-autolink/source-commands.mjs
          node --test --test-reporter=tap tests/video-autolink-http.test.mjs 2>&1 | tee "$RUNNER_TEMP/video-transport-evidence/tests.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: video-transport-${{ github.run_id }}
          path: ${{ runner.temp }}/video-transport-evidence/
          if-no-files-found: error
          retention-days: 14

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'
      - run: npm ci --ignore-scripts
      - name: Pinned local browser harness
        run: npm install --prefix "$RUNNER_TEMP/video-browser-tools" --ignore-scripts --no-audit --no-fund --package-lock=false playwright@1.56.1
      - name: Native Course Media upload, explicit authorisation, lost ACK, review, separate publication and late-body privacy
        env:
          VIDEO_BROWSER: ${{ matrix.engine }}
          PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
        run: |
          set -euo pipefail
          export VIDEO_PLAYWRIGHT_ROOT="$RUNNER_TEMP/video-browser-tools"
          export VIDEO_UI_EVIDENCE="$RUNNER_TEMP/video-ui-evidence"
          mkdir -p "$VIDEO_UI_EVIDENCE"
          node tools/video-autolink-ui-acceptance.mjs 2>&1 | tee "$VIDEO_UI_EVIDENCE/browser.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: video-ui-${{ matrix.engine }}-${{ github.run_id }}
          path: ${{ runner.temp }}/video-ui-evidence/
          if-no-files-found: error
          retention-days: 14

  paired-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: MaktabForlife/Academy
          ref: 7278fa636d0d712091be2f42bf0d2dd382ad1764
          path: source-academy
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts
        working-directory: source-academy/backend
      - name: Actual paired native PIN/Source and signed private recording path
        run: |
          set -euo pipefail
          test ! -e "$GITHUB_WORKSPACE/../Academy"
          ln -s "$GITHUB_WORKSPACE/source-academy" "$GITHUB_WORKSPACE/../Academy"
          export ACADEMY_SOURCE="$GITHUB_WORKSPACE/source-academy"
          mkdir -p "$RUNNER_TEMP/video-paired-source-evidence"
          node --test --test-reporter=tap tests/video-autolink-paired-source.test.mjs 2>&1 | tee "$RUNNER_TEMP/video-paired-source-evidence/tests.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: video-paired-source-${{ github.run_id }}
          path: ${{ runner.temp }}/video-paired-source-evidence/
          if-no-files-found: error
          retention-days: 14

  workflow-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'
      - run: npm ci --ignore-scripts
      - name: Pinned current local runtime, installed only in the disposable runner
        run: npm install --prefix "$RUNNER_TEMP/video-current-runtime" --ignore-scripts --no-audit --no-fund --package-lock=false miniflare@5.20261103.0-beta
      - name: Actual local Workflow SDK and durable engine; private paid-claim metadata only
        run: |
          set -euo pipefail
          export VIDEO_CURRENT_MINIFLARE="$RUNNER_TEMP/video-current-runtime/node_modules/miniflare/dist/src/index.js"
          mkdir -p "$RUNNER_TEMP/video-workflow-runtime-evidence"
          node --check src/video-autolink/runtime.mjs
          node --check src/video-autolink/workflow.mjs
          node --test --test-reporter=tap tests/video-autolink-workflow-runtime.test.mjs 2>&1 | tee "$RUNNER_TEMP/video-workflow-runtime-evidence/tests.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: video-workflow-runtime-${{ github.run_id }}
          path: ${{ runner.temp }}/video-workflow-runtime-evidence/
          if-no-files-found: error
          retention-days: 14

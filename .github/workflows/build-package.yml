name: Build release package in GitHub
on:
  push:
    branches: [feature/github-cloud-releases]
    paths: [.github/workflows/build-package.yml, tools/cloud-package.mjs]
  workflow_dispatch:
    inputs:
      version:
        description: New release version; code version must already be prepared
        required: true
        type: string
      baseline_version:
        description: Previous verified package version
        default: "109.17"
        type: string
      refresh_deploy_tool:
        description: Pin the reviewed Wrangler 4.157.0 deployment-metadata fix
        default: false
        type: boolean
      dry_run:
        description: Compare rebuilt current package without pushing
        default: true
        type: boolean
permissions:
  contents: write
concurrency:
  group: package-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.18.0"
      - name: Install pinned build tools
        run: |
          if [ "$GITHUB_REPOSITORY" = "MaktabForlife/Academy" ]; then npm ci --prefix backend --no-audit --no-fund; else npm ci --no-audit --no-fund; fi
      - name: Refresh the reviewed deployment tool on GitHub
        if: inputs.refresh_deploy_tool
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          test "$GITHUB_REPOSITORY" = "MaktabForlife/AcademyStudio"
          test "$GITHUB_REF_NAME" = "studio_dev"
          test "${{ inputs.dry_run }}" = "true"
          test -z "$(git status --porcelain)"
          release_initial_sha="$(git rev-parse HEAD)"
          npm install --save-dev --save-exact wrangler@4.157.0 --ignore-scripts --no-audit --no-fund
          node --input-type=module <<'TOOL_CHECK'
          import assert from 'node:assert/strict';
          import {readFile} from 'node:fs/promises';
          import {execFileSync} from 'node:child_process';
          import {resolve} from 'node:path';
          import {buildStudioPackage} from './tools/build-studio-package.mjs';
          const old=JSON.parse(execFileSync('git',['show','HEAD:package.json'],{encoding:'utf8'}));
          const next=JSON.parse(await readFile('package.json','utf8'));
          assert.equal(next.devDependencies.wrangler,'4.157.0');
          const restored=structuredClone(next);restored.devDependencies.wrangler=old.devDependencies.wrangler;
          assert.deepEqual(restored,old,'Only the deployment tool may change.');
          const files=execFileSync('git',['diff','--name-only'],{encoding:'utf8'}).trim().split('\n').sort();
          assert.deepEqual(files,['package-lock.json','package.json']);
          const version=JSON.parse(await readFile('release/current.json','utf8')).version;
          const built=await buildStudioPackage({version,output:resolve(process.env.RUNNER_TEMP,'reviewed-tool-build/public')});
          assert(built.exactReviewedBytes);
          console.log(JSON.stringify({deploymentTool:'4.157.0',exactPublicBytes:true,publicFiles:built.files,macWrites:0,cloudflareRequests:0}));
          TOOL_CHECK
          git diff --check
          test "$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)" = "$release_initial_sha"
          git add -- package.json package-lock.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m '[CF-Pages-Skip] [skip ci] Pin Wrangler 4.157.0 fix for scoped-token deployments'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
      - name: Install verified credential scanner
        env:
          SCANNER_DIGEST: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          mkdir -p "$RUNNER_TEMP/scanner"
          curl --fail --location --silent --show-error https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/scanner/package.tgz"
          printf '%s  %s\n' "$SCANNER_DIGEST" "$RUNNER_TEMP/scanner/package.tgz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/scanner/package.tgz" -C "$RUNNER_TEMP/scanner" gitleaks
      - name: Build frozen public package on GitHub
        env:
          VERSION: ${{ inputs.version }}
          BASELINE: ${{ inputs.baseline_version }}
          DRY_RUN: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run }}
          GITLEAKS_BIN: ${{ runner.temp }}/scanner/gitleaks
          WRANGLER_SEND_METRICS: "false"
        run: node tools/cloud-package.mjs "$VERSION" "$BASELINE" "$DRY_RUN"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: package-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/package-evidence/package-check.json
          retention-days: 30

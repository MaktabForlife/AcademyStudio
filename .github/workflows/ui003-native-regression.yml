name: UI003 paired native media regression
on:
  push:
    branches: [feature/ui003-processing-development-20261106]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  native-media:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: work/AcademyStudio
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: MaktabForlife/Academy
          ref: 8624eede5a7757898992c01e73d6b09dfed1f4b5
          path: work/Academy
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: work/AcademyStudio
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: work/Academy/backend
      - name: Existing native media, review, Course publication and dashboard cases with the exact paired source
        working-directory: work/AcademyStudio
        env:
          ACADEMY_SOURCE: ${{ github.workspace }}/work/Academy
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ui003-native-regression"
          node --test --test-reporter=tap --test-concurrency=1 tests/private-playlist-reference.test.mjs tests/private-playlist-reference-ui.test.mjs tests/private-playlist-reference-monthly-proxy.test.mjs tests/monthly-media-review-ui.test.mjs tests/course-playlist-workflow.test.mjs tests/monthly-media-collection.test.mjs tests/dashboard-load.test.mjs tests/circles-dashboard-consumer.test.mjs 2>&1 | tee "$RUNNER_TEMP/ui003-native-regression/tests.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ui003-paired-native-regression-${{ github.run_id }}
          path: ${{ runner.temp }}/ui003-native-regression/
          if-no-files-found: error
          retention-days: 14

name: Full paired UI integration verification only
on:
  push:
    branches: [validation/ui-integration-20261107]
    paths:
      - .github/workflows/ui-integration-full-pair.yml
permissions:
  contents: read
  statuses: read
  pull-requests: read
defaults:
  run:
    shell: bash
concurrency:
  group: ui-integration-full-pair-20261107
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      source_sha: ${{ steps.check.outputs.source_sha }}
      studio_sha: ${{ steps.check.outputs.studio_sha }}
      version: ${{ steps.check.outputs.version }}
    env:
      M4L_PROJECT_ROOT: ${{ github.workspace }}
      M4L_RELEASE_OUTPUT: ${{ github.workspace }}/.cloud-output
      GITLEAKS_BIN: ${{ github.workspace }}/.cloud-tools/gitleaks/gitleaks
      WRANGLER_SEND_METRICS: "false"
      GH_TOKEN: ${{ github.token }}
      M4L_APPROVAL_MERGE_SHA: ${{ inputs.approval_merge_sha || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: MaktabForlife/Academy
          ref: 87bf3daa54bd82773b62a5a71f67d28e2aea654d
          path: work/Academy
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: MaktabForlife/AcademyStudio
          ref: ${{ github.sha }}
          path: work/AcademyStudio
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.18.0"
      - name: Install pinned test dependencies on GitHub
        run: |
          npm ci --prefix work/Academy/backend --no-audit --no-fund
          npm ci --prefix work/AcademyStudio --no-audit --no-fund
      - name: Install checksum-pinned credential scanner on GitHub
        env:
          SCANNER_DIGEST: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          mkdir -p "$(dirname "$GITLEAKS_BIN")"
          curl --fail --location --silent --show-error https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$(dirname "$GITLEAKS_BIN")/package.tgz"
          printf '%s  %s\n' "$SCANNER_DIGEST" "$(dirname "$GITLEAKS_BIN")/package.tgz" | sha256sum --check
          tar -xzf "$(dirname "$GITLEAKS_BIN")/package.tgz" -C "$(dirname "$GITLEAKS_BIN")" gitleaks
      - name: Test the exact paired GitHub source with synthetic data
        id: check
        working-directory: work/AcademyStudio
        env:
          NODE_OPTIONS: --import=${{ github.workspace }}/work/AcademyStudio/tools/preserve-local-files.mjs
        run: |
          node --test --test-reporter=tap tests/reviewed-sql-integrity.test.mjs
          node tools/cloud-release-check.mjs check
      - name: Test bounded health propagation and fail-closed release checks
        working-directory: work/AcademyStudio
        run: node --test --test-reporter=tap tests/release-health.test.mjs tests/release-safety.test.mjs tests/approved-deployment.test.mjs tests/approved-deployment-retry.test.mjs > "$M4L_RELEASE_OUTPUT/release-health-tests.log" 2>&1
      - name: Verify the reported management faults on the exact release source
        working-directory: work/Academy
        run: node --test --test-reporter=tap backend/tests/academy-management-origin-regression.test.mjs backend/tests/academy-release-labels.test.mjs > "$M4L_RELEASE_OUTPUT/management-regression-tests.log" 2>&1
      - name: Build the reviewed native homepage for isolated browser checks
        working-directory: work/Academy
        run: node backend/tools/academy-pages-build.mjs
      - name: Install isolated homepage browser on GitHub
        env:
          REVIEW_BROWSER_MODULES: ${{ runner.temp }}/academy-homepage-browser
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/academy-homepage-browsers
        run: |
          npm install --prefix "$REVIEW_BROWSER_MODULES" --no-save --package-lock=false --no-audit --no-fund playwright@1.56.1
          node "$REVIEW_BROWSER_MODULES/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Verify the actual native homepage across six viewport widths
        working-directory: work/Academy
        env:
          REVIEW_BROWSER_MODULES: ${{ runner.temp }}/academy-homepage-browser
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/academy-homepage-browsers
        run: node tools/homepage-native-check.mjs
      - name: Store native homepage browser evidence in GitHub
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-homepage-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/homepage-native-evidence/
          retention-days: 30
      - name: Store review evidence in GitHub
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: paired-review-${{ github.run_id }}
          retention-days: 30
          path: |
            ${{ github.workspace }}/.cloud-output/checks.json
            ${{ github.workspace }}/.cloud-output/baseline.json
            ${{ github.workspace }}/.cloud-output/local-acceptance.json
            ${{ github.workspace }}/.cloud-output/approval-and-scope.json
            ${{ github.workspace }}/.cloud-output/github-verification.json
            ${{ github.workspace }}/.cloud-output/source-assets.json
            ${{ github.workspace }}/.cloud-output/studio-assets.json
            ${{ github.workspace }}/.cloud-output/static-route-matrix.json
            ${{ github.workspace }}/.cloud-output/bundle-checks.json
            ${{ github.workspace }}/.cloud-output/academy-tests.log
            ${{ github.workspace }}/.cloud-output/management-regression-tests.log
            ${{ github.workspace }}/.cloud-output/release-health-tests.log
            ${{ github.workspace }}/.cloud-output/paired-media-tests.log
            ${{ github.workspace }}/.cloud-output/portal-source-tests.log
            ${{ github.workspace }}/.cloud-output/portal-paired-tests.log
            ${{ github.workspace }}/.cloud-output/homepage-contract-tests.log
            ${{ github.workspace }}/.cloud-output/studio-hosting-tests.log

name: V110 intent and public re-entry review
on:
  create:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  intent-reentry:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/validation/jwt-v110-reentry-')
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    defaults:
      run:
        shell: bash
        working-directory: work/AcademyStudio
    env:
      ACADEMY_SOURCE: ${{ github.workspace }}/work/Academy
      HIFZ_SOURCE: ${{ github.workspace }}/work/Hifz
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: work/AcademyStudio
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: MaktabForlife/Academy
          ref: 0c0dd570a11486b420517d1e40389e4789f9de9a
          path: work/Academy
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: MaktabForlife/Hifz
          ref: becb310d18fc899562c1d76cea583cea801af809
          path: work/Hifz
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.18.0"
      - name: Check identical disabled runtime sources and native syntax
        run: |
          mkdir -p .build/jwt-v110-reentry
          node tools/check-jwt-browser-sources.mjs
          node --check "$ACADEMY_SOURCE/js/m4l-academy-login.js"
          node --check src/auth/v110/browser-app-privacy.mjs
          node --check public/auth/v110/browser-bootstrap.js
          node --check tests/jwt-v110-native-browser.test.mjs
      - name: Prove local pending intent fencing at the real app privacy adapter
        run: |
          set -o pipefail
          node --test --test-reporter=tap tests/jwt-v110-browser-intents.test.mjs 2>&1 | tee .build/jwt-v110-reentry/intents.log
      - name: Prove native public re-entry and affected browser clearing paths
        timeout-minutes: 3
        run: |
          set -o pipefail
          node --test --test-reporter=tap tests/jwt-v110-native-browser.test.mjs 2>&1 | tee .build/jwt-v110-reentry/browser.log
          git diff --exit-code
          git -C "$ACADEMY_SOURCE" diff --exit-code
          git -C "$HIFZ_SOURCE" diff --exit-code
          node --input-type=module -e "import {writeFileSync} from 'node:fs';writeFileSync('.build/jwt-v110-reentry/source.json',JSON.stringify({commit:process.env.GITHUB_SHA,academy:'0c0dd570a11486b420517d1e40389e4789f9de9a',hifz:'becb310d18fc899562c1d76cea583cea801af809',run:process.env.GITHUB_RUN_ID,actualPINUIOnly:true,issuerOrPINAuthenticationProved:false,hostedRequests:0,liveDBChanges:0,deployed:false})+'\n');"
      - name: Preserve scoped synthetic follow-up evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jwt-v110-reentry-${{ github.run_id }}
          include-hidden-files: true
          retention-days: 30
          path: |
            work/AcademyStudio/.build/jwt-v110-reentry/
            work/AcademyStudio/.build/jwt-v110-native-browser/browser.json
            work/AcademyStudio/.build/jwt-v110-browser-integration/shared-source.json

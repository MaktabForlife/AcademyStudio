name: Prepare Studio SaaS hosting without activation
on:
  workflow_dispatch:
    inputs:
      academy_ref:
        description: Reviewed Academy source commit
        required: true
        default: dded14ffbfac5f27e157253e397b3b4e96bf6ecd
        type: string
      deploy:
        description: Deploy only the tested Studio continuity Worker
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: studio-saas-preparation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      CI: "true"
      WRANGLER_SEND_METRICS: "false"
      ACADEMY_SOURCE: ${{ github.workspace }}/Academy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: MaktabForlife/Academy
          ref: ${{ inputs.academy_ref }}
          path: Academy
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: Studio
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.18.0"
      - name: Install pinned dependencies on the disposable runner
        run: |
          npm ci --prefix Academy/backend --no-audit --no-fund
          npm ci --prefix Studio --no-audit --no-fund
      - name: Prepare reviewed static Pages and SaaS Worker candidate without deployment
        working-directory: Studio
        run: |
          node --check hosting/saas/assets.mjs
          node --check hosting/saas/worker.mjs
          node --check tools/prepare-studio-saas.mjs
          node --check tools/studio-hosting-release.mjs
          node --check tests/studio-saas.test.mjs
          node tools/prepare-studio-saas.mjs
          node node_modules/wrangler/bin/wrangler.js types .build/studio-saas/worker-env.d.ts --config .build/studio-saas/worker.jsonc
          node node_modules/wrangler/bin/wrangler.js deploy --dry-run --config .build/studio-saas/worker.jsonc --outdir .build/studio-saas/dry-run
      - name: Test SaaS, static isolation, read budgets and current permissions using synthetic data
        working-directory: Studio
        run: |
          node --test --test-concurrency=1 tests/studio-saas.test.mjs 2>&1 | tee .build/studio-saas/saas-tests.log
          node --test --test-concurrency=1 tests/deployment-origin-config.test.mjs tests/website-routing.test.mjs tests/website-launch.test.mjs tests/academy-origins.test.mjs tests/parallel-access.test.mjs tests/access-catalogue.test.mjs tests/course-policy.test.mjs tests/monthly-media-collection.test.mjs tests/private-playlist-reference-monthly-proxy.test.mjs tests/reader-bootstrap.test.mjs tests/dashboard-studio-join-paired.test.mjs tests/read-budgets.test.mjs 2>&1 | tee .build/studio-saas/studio-tests.log
      - name: Test unchanged Academy portal and Hifz boundaries without importing Studio UI
        working-directory: Academy
        run: |
          node --test backend/tests/portal-hosting.test.mjs backend/tests/academy-circles-native.test.mjs backend/tests/academy-circles-native-join.test.mjs backend/tests/academy-circles-free-join.test.mjs backend/tests/academy-hifz-handoff.test.mjs backend/tests/academy-hifz-bridge-ui.test.mjs 2>&1 | tee ../Studio/.build/studio-saas/academy-tests.log
      - name: Verify preparation changed no tracked source
        run: |
          git -C Studio diff --exit-code
          git -C Academy diff --exit-code
      - name: Check continuity release scope and public bytes
        working-directory: Studio
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/studio-hosting-release.mjs check
      - name: Scan new commits for credentials
        working-directory: Studio
        run: |
          mkdir -p .build/scanner
          curl --fail --location --silent --show-error https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o .build/scanner/package.tgz
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb .build/scanner/package.tgz | sha256sum --check
          tar -xzf .build/scanner/package.tgz -C .build/scanner gitleaks
          .build/scanner/gitleaks git --log-opts=e8fe6ea455537e9a1fba292080921a022f530d12..HEAD --no-banner --redact --report-format json --report-path .build/studio-saas/credential-scan.json --log-level error
      - name: Store prepared hosting and evidence in GitHub only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: studio-saas-preparation-${{ github.run_id }}
          include-hidden-files: true
          retention-days: 30
          path: |
            Studio/.build/studio-saas/pages/
            Studio/.build/studio-saas/worker.jsonc
            Studio/.build/studio-saas/transition-worker.jsonc
            Studio/.build/studio-saas/candidate-worker.mjs
            Studio/.build/studio-saas/worker-env.d.ts
            Studio/.build/studio-saas/bundle-meta.json
            Studio/.build/studio-saas/preparation.json
            Studio/.build/studio-saas/activation-plan.json
            Studio/.build/studio-saas/*-tests.log
            Studio/.build/studio-saas/credential-scan.json

  deploy:
    if: github.ref == 'refs/heads/studio_dev' && inputs.deploy
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      REVIEWED_SHA: ${{ github.sha }}
      CLOUDFLARE_SOURCE_API_TOKEN: ${{ secrets.CLOUDFLARE_SOURCE_API_TOKEN }}
      CLOUDFLARE_STUDIO_API_TOKEN: ${{ secrets.CLOUDFLARE_STUDIO_API_TOKEN }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: Studio
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.18.0"
      - name: Install pinned release tools on GitHub
        run: npm ci --prefix Studio --no-audit --no-fund
      - name: Stage, verify and deploy only Studio continuity
        working-directory: Studio
        run: node tools/studio-hosting-release.mjs deploy
      - name: Preserve release evidence in GitHub
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: studio-hosting-release-${{ github.run_id }}
          include-hidden-files: true
          retention-days: 90
          path: Studio/.build/studio-hosting-release/

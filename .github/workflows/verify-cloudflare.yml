name: Verify Cloudflare connection (read only)
on:
  workflow_dispatch:
    inputs:
      scope:
        description: Check both accounts or Studio only
        type: choice
        options: [both, studio, studio-format, studio-metadata, staged-versions]
        default: both
      source_version:
        description: Uploaded Academy Worker version for a read-only visibility check
        default: ""
        type: string
      studio_version:
        description: Uploaded Studio Worker version for a read-only visibility check
        default: ""
        type: string
permissions:
  contents: read
concurrency:
  group: cloudflare-connection-check
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'MaktabForlife/AcademyStudio' && github.ref == 'refs/heads/studio_dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.18.0"
      - name: Verify selected read-only management endpoints
        env:
          CONNECTION_SCOPE: ${{ inputs.scope }}
          SOURCE_VERSION: ${{ inputs.source_version }}
          STUDIO_VERSION: ${{ inputs.studio_version }}
          CLOUDFLARE_SOURCE_API_TOKEN: ${{ secrets.CLOUDFLARE_SOURCE_API_TOKEN }}
          CLOUDFLARE_STUDIO_API_TOKEN: ${{ secrets.CLOUDFLARE_STUDIO_API_TOKEN }}
        run: |
          node --input-type=module <<'VERIFY_NODE'
          import {appendFile} from 'node:fs/promises';
          const source=process.env.CLOUDFLARE_SOURCE_API_TOKEN,studio=process.env.CLOUDFLARE_STUDIO_API_TOKEN;
          const sourceAccount='c9a3e355b3d7a795880b1d36a1dbe123',studioAccount='2b01ca929611669e032703ff19f7098f';
          const allTasks=[
           {label:'Academy Worker',account:sourceAccount,token:source,path:'/workers/scripts/devrebootworker/settings',kind:'worker'},
           {label:'Academy coordinator metadata',account:sourceAccount,token:source,path:'/workers/scripts/academy_split_coordinator/settings',kind:'worker'},
           {label:'Academy Pages',account:sourceAccount,token:source,path:'/pages/projects/academy-maktab4life',kind:'pages'},
           {label:'Studio Worker',account:studioAccount,token:studio,path:'/workers/scripts/academy-studio-parallel/settings',kind:'worker'}
          ];
          const scope=process.env.CONNECTION_SCOPE||'both';
          if(!['both','studio','studio-format','studio-metadata','staged-versions'].includes(scope))throw new Error('Unknown verification scope');
          const metadataPaths=[
           ['/workers/services/academy-studio-parallel/environments/production/bindings','Studio bindings metadata'],
           ['/workers/services/academy-studio-parallel/environments/production/subdomain','Studio subdomain metadata'],
           ['/workers/services/academy-studio-parallel/environments/production','Studio service metadata'],
           ['/workers/scripts/academy-studio-parallel/schedules','Studio schedules metadata']
          ];
          if(scope==='staged-versions'&&![process.env.SOURCE_VERSION,process.env.STUDIO_VERSION].every(v=>/^[a-f0-9-]{36}$/.test(v||'')))throw Error('Choose the two uploaded version IDs.');
          const tasks=scope==='staged-versions'?[
           {label:'Academy uploaded version',account:sourceAccount,token:source,path:'/workers/scripts/devrebootworker/versions/'+process.env.SOURCE_VERSION,kind:'metadata'},
           {label:'Studio uploaded version',account:studioAccount,token:studio,path:'/workers/scripts/academy-studio-parallel/versions/'+process.env.STUDIO_VERSION,kind:'metadata'}
          ]:scope==='studio-metadata'?metadataPaths.map(([path,label])=>({label,path,account:studioAccount,token:studio,kind:'metadata'})):scope.startsWith('studio')?allTasks.filter(t=>t.label==='Studio Worker'):allTasks;
          let attempted=0;
          const results=await Promise.all(tasks.map(async t=>{
           if(!t.token)return {label:t.label,passed:false,status:'not requested',issue:'Saved secret is empty'};
           if(t.token!==t.token.trim())return {label:t.label,passed:false,status:'not requested',issue:'Saved token contains leading or trailing whitespace'};
           if(!/^[\x21-\x7e]+$/.test(t.token))return {label:t.label,passed:false,status:'not requested',issue:'Saved token contains whitespace, line breaks or non-ASCII characters',format:{spacesOrTabs:/[ \t]/.test(t.token),lineBreaks:/[\r\n]/.test(t.token),nonAscii:/[^\x00-\x7f]/.test(t.token),looksLikeCurl:/^\s*curl\b/i.test(t.token),looksMasked:/[\u2022\u25cf]/.test(t.token),ellipsis:/\u2026/.test(t.token),curlyQuotes:/[\u2018-\u201f]/.test(t.token),invisibleFormatting:/[\u200b-\u200f\u202a-\u202e\u2060-\u206f\ufeff]/.test(t.token),longDash:/[\u2013\u2014]/.test(t.token),fullWidthCharacters:/[\uff01-\uff5e]/.test(t.token)}};
           if(scope==='studio-format')return {label:t.label,passed:true,status:'format valid; connection not requested'};
           try{
            attempted++;
            const response=await fetch('https://api.cloudflare.com/client/v4/accounts/'+t.account+t.path,{
             method:'GET',headers:{Authorization:'Bearer '+t.token,Accept:'application/json'},redirect:'error',signal:AbortSignal.timeout(30000)
            });
            const value=await response.json();
            if(!response.ok||value.success!==true)return {label:t.label,passed:false,status:response.status,errorCodes:(value.errors||[]).map(e=>e.code).filter(n=>typeof n==='number')};
            const valid=t.kind==='metadata'?value.result!==undefined&&value.result!==null:t.kind==='pages'?value.result?.name==='academy-maktab4life':Array.isArray(value.result?.bindings);
            return {label:t.label,passed:valid,status:response.status,...(t.kind==='worker'&&valid?{bindings:value.result.bindings.length}:{})};
           }catch(e){
            const errorType=['TypeError','SyntaxError','TimeoutError','AbortError'].includes(e?.name)?e.name:'RequestError';
            const causeCode=typeof e?.cause?.code==='string'&&/^[A-Z0-9_]{1,40}$/.test(e.cause.code)?e.cause.code:undefined;
            return {label:t.label,passed:false,status:'request failed',errorType,...(causeCode?{causeCode}:{})};
           }
          }));
          for(const r of results)console.log(JSON.stringify(r));
          const passed=results.every(r=>r.passed);
          console.log(JSON.stringify({passed,scope,managementRequestsAttempted:attempted,applicationRequests:0,databaseQueries:0,resourceChanges:0,deployments:0}));
          if(process.env.GITHUB_STEP_SUMMARY)await appendFile(process.env.GITHUB_STEP_SUMMARY,
           '# Cloudflare connection verification\n\n'+results.map(r=>'- '+r.label+': '+(r.passed?'PASS':'FAIL')+' ('+r.status+')'+(r.issue?' — '+r.issue:'')).join('\n')+
           '\n\nManagement GET attempts: '+attempted+'. No application requests, database queries, resource changes or deployment.\n'
          );
          if(!passed)process.exitCode=1;
          VERIFY_NODE
